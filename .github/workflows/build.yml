name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install PyQt5
          pip install pyzipper

      - name: Build exe
        run: pyinstaller --noconfirm Commemorate.spec

      - name: Package app.zip and publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Write-Output "token_len=$($env:GH_TOKEN.Length)"
          New-Item -ItemType Directory -Force -Path Release | Out-Null
          Compress-Archive -Path dist\Commemorate.exe -DestinationPath Release\app.zip -Force
          $headers = @{ Authorization = "token $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          $repo = "${{ github.repository }}"
          $tag = "${{ github.ref_name }}"
          $body = @{ tag_name = $tag; name = $tag; body = "自动发布 $tag" } | ConvertTo-Json
          try {
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases" -Method Post -Headers $headers -Body $body -ContentType "application/json"
          } catch {
            $existing = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/tags/$tag" -Headers $headers
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/$($existing.id)" -Method Patch -Headers $headers -Body $body -ContentType "application/json"
          }
          $uploadUrl = $release.upload_url -replace '\{\?name,label\}', '?name=app.zip'
          Invoke-RestMethod -Uri $uploadUrl -Method Post -Headers $headers -InFile "Release\app.zip" -ContentType "application/zip" | Out-Null
          $hash = (Get-FileHash -Algorithm SHA256 "Release\app.zip").Hash.ToLower()
          Write-Output "release_url=$($release.html_url) sha256=$hash"

      - name: Update version.json in repo
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $hash = (Get-FileHash -Algorithm SHA256 "Release\app.zip").Hash.ToLower()
          $json = @{
            version = $version
            release_date = (Get-Date -Format 'yyyy-MM-dd')
            changelog = "自动发布 v$version"
            download_url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/app.zip"
            sha256 = $hash
          } | ConvertTo-Json
          $content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json))
          $headers = @{
            Authorization = "token $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
          }
          $apiUrl = "https://api.github.com/repos/${{ github.repository }}/contents/version.json"
          try {
            $existing = Invoke-RestMethod -Uri $apiUrl -Headers $headers -Method Get
            $sha = $existing.sha
          } catch {
            $sha = $null
          }
          $body = @{ message = "release $version"; content = $content; branch = "main" }
          if ($sha) { $body.sha = $sha }
          Invoke-RestMethod -Uri $apiUrl -Headers $headers -Method Put `
            -Body ($body | ConvertTo-Json -Depth 5) -ContentType "application/json"
